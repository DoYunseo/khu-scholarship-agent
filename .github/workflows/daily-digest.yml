name: Daily Scholarship Digest

on:
  schedule:
    - cron: "55 8 * * *"
      timezone: Asia/Seoul
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send scholarship digest
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_TO_ADDITIONAL: ${{ secrets.EMAIL_TO_ADDITIONAL }}
          EMAIL_UNSUBSCRIBE_SECRET: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
          EMAIL_IMAP_HOST: ${{ secrets.EMAIL_IMAP_HOST }}
          EMAIL_IMAP_PORT: ${{ secrets.EMAIL_IMAP_PORT }}
          SCHOLARSHIP_URL: ${{ secrets.SCHOLARSHIP_URL }}
        run: |
          set -x
          python scripts/send_digest.py 2>&1 | tee send_digest_output.log
          cat send_digest_output.log

